apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-demo-invoice-service
  namespace: billing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dr-demo-invoice-service
  template:
    metadata:
      labels:
        app: dr-demo-invoice-service
    spec:
      containers:
        - name: dr-demo-invoice-service
          image: ghcr.io/oodles-noodles/dr-demo-invoice-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dr-demo-invoice-service-db
                  key: url
